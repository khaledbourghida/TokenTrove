<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Reward</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Loading State -->
            <div id="loading-state" class="state">
                <div class="spinner"></div>
                <h1 id="loading-title">Processing Your Reward...</h1>
                <p id="loading-description">Please wait while we claim your tokens</p>
            </div>

            <!-- Success State -->
            <div id="success-state" class="state hidden">
                <div class="success-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="#10B981"/>
                        <path d="m9 12 2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 id="success-title">Reward Claimed Successfully!</h1>
                <div class="token-display">
                    <span class="token-amount">+10</span>
                    <span class="token-label" id="token-label">Tokens Added</span>
                </div>
                <p id="success-description">Your tokens have been added to your account</p>
            </div>

            <!-- Error State -->
            <div id="error-state" class="state hidden">
                <div class="error-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="#EF4444"/>
                        <line x1="15" y1="9" x2="9" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <line x1="9" y1="9" x2="15" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 id="error-title">Claim Failed</h1>
                <p id="error-message">Something went wrong</p>
                <button id="retry-button" class="retry-btn">Try Again</button>
            </div>

            <!-- Language Toggle -->
            <div class="language-toggle">
                <button id="lang-en" class="lang-btn active">EN</button>
                <button id="lang-ar" class="lang-btn">AR</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
